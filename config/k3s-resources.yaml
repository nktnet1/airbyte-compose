apiVersion: v1
kind: ServiceAccount
metadata:
  name: airbyte-admin
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airbyte-admin-role
  namespace: default
rules:
  - apiGroups: ["*"]
    resources:
      - configmaps
      - endpoints
      - jobs
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - secrets
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airbyte-admin-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airbyte-admin-role
subjects:
  - kind: ServiceAccount
    name: airbyte-admin
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-db-svc
  namespace: default
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: airbyte-db-svc-compose
  namespace: default
  labels:
    kubernetes.io/service-name: airbyte-db-svc
addressType: IPv4
ports:
  - name: postgresql
    protocol: TCP
    port: 5432
endpoints:
  - addresses: ["__DB_IP__"]
    conditions:
      ready: true
---
